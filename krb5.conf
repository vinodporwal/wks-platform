[libdefaults]
    default_realm = CONNECTEDPLANT.HONEYWELL.COM
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = false
    proxiable = false
    default_tkt_enctypes = aes256-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96

[realms]
    CONNECTEDPLANT.HONEYWELL.COM = {
        kdc = HPSITDC02.connectedplant.honeywell.com
        kdc = HPSITDC03.connectedplant.honeywell.com
        admin_server = HPSITDC02.connectedplant.honeywell.com
    }

[domain_realm]
    connectedplant.honeywell.com = CONNECTEDPLANT.HONEYWELL.COM
    connectedplant.honeywell.com = CONNECTEDPLANT.HONEYWELL.COM

[logging]
    default = FILE:/var/log/krb5libs.log
    kdc = FILE:/var/log/kdc.log
    admin_server = FILE:/var/log/kadmind.log
