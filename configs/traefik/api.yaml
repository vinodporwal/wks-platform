http:
  routers:
    case-engine-rest-api:
      entryPoints:
        - web
      service: case-engine-rest-api
      rule: PathPrefix("/cm")
    storage-api:
      entryPoints:
        - web
      service: storage-api
      rule: PathPrefix("/cm")

  services:
    case-engine-rest-api:
      loadBalancer:
        servers:
          - url: http://docker.formac.localhost:8081
    storage-api:
      loadBalancer:
        servers:
          - url: http://docker.formac.localhost:8085
