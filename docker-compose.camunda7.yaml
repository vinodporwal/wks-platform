version: '3.7'
name: wks-platform
services:

    camunda:
        image: ${CAMUNDA_DOCKER_IMAGE}:${CAMUNDA7_VERSION}
        command: ./camunda.sh --rest --webapps
        ports:
            - 8080:8080
        volumes:
            # AOP_Approval_v2 needs AopRoleCollectionListener + AopGateDecisionListener on the
            # engine classpath. Without this jar Camunda returns ENGINE-09017 / ClassNotFound.
            # Build first: mvn -pl libraries/c7-plugins -am package -DskipTests (from apps/java).
            # Server/prod: use apps/docker/camunda7/Dockerfile which bakes the jar into the image.
            - ./apps/java/libraries/c7-plugins/target/c7-plugins-1.0-SNAPSHOT.jar:/camunda/configuration/userlib/c7-plugins-1.0-SNAPSHOT.jar
        healthcheck:
            test: curl --fail http://localhost:8080/engine-rest/version || exit 1
            interval: 10s
            retries: 3
            start_period: 5s
            timeout: 10s
        depends_on:
            mongodb:
                condition: service_healthy
                
    case-engine-rest-api:
        build:
            context: apps/java/services/case-engine-rest-api
        ports:
            - 8081:8081
        links:
            - mongodb
            - camunda
        env_file:
            - case-engine-rest-api.env
        environment:
            - CAMUNDA_VERSION=camunda7
            - CAMUNDA_BASE_URL=${CAMUNDA_BASE_URL}
            - MONGO_DATABASE=${MONGO_WKS_DATABASE}
            - MONGO_CONN=${MONGO_CONNECTION_URL}
            - KEYCLOAK_URL=${KEYCLOAK_URL}
            - OPA_URL=${OPA_URL}
            - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
            - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            - KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME}
        depends_on:
            mongodb:
                condition: service_healthy
            camunda:
                condition: service_healthy

    c7-external-tasks:
        build:
            context: apps/java/services/c7-external-tasks
        links:
            - camunda
            - case-engine-rest-api
        environment:
            - CAMUNDA_BASE_URL=${CAMUNDA_BASE_URL}
            - CAMUNDA_USERNAME=${CAMUNDA_USERNAME}
            - CAMUNDA_PASSWORD=${CAMUNDA_PASSWORD}
            - KEYCLOAK_URL=${KEYCLOAK_TOKEN_URL}
            - WKS_CASE_API_URL=${WKS_CASE_API_URL}
            - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED}
            - DISABLE_BACKOFF_STRATEGY=${DISABLE_BACKOFF_STRATEGY}
        depends_on:
            camunda:
                condition: service_healthy