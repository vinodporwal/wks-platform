name: wks-platform
services:

    camunda:
        image: ${CAMUNDA_DOCKER_IMAGE}:${CAMUNDA7_VERSION}
        command: ./camunda.sh --rest --webapps
        ports:
            - 8080:8080
            - 8089:8089
        healthcheck:
            test: curl --fail http://localhost:8080/engine-rest/version || exit 1
            interval: 10s
            retries: 20
            start_period: 120s
            timeout: 10s
        depends_on:
            mongodb:
                condition: service_healthy

    case-engine-rest-api:
        build:
            context: apps/java/services/case-engine-rest-api
        ports:
            - 8081:8081
        links:
            - mongodb
            - camunda
        env_file:
            - case-engine-rest-api
        environment:
            - CAMUNDA_VERSION=camunda7
            - CAMUNDA_BASE_URL=${CAMUNDA_BASE_URL}
            - MONGO_DATABASE=${MONGO_WKS_DATABASE}
            - MONGO_DATABASE_TENANT=${MONGO_DEMO_DATA_LOADER_DATABASE}
            - MONGO_CONN=${MONGO_CONNECTION_URL}
            - KEYCLOAK_URL=${KEYCLOAK_URL}
            - OPA_URL=${OPA_URL}
            - GE_AUTHENTICATION_DATASOURCE=${GE_AUTHENTICATION_DATASOURCE}
            - GE_AUTHENTICATION_ID=${GE_AUTHENTICATION_ID}
            - GE_AUTHENTICATION_PASSWORD=${GE_AUTHENTICATION_PASSWORD}
            - GE_AUTHENTICATION_API=${GE_AUTHENTICATION_API}
            - GE_USERS_API=${GE_USERS_API}
            - GE_CREATE_CASE_API=${GE_CREATE_CASE_API}
            - GE_CASE_STATUS_API=${GE_CASE_STATUS_API}
            - KAFKA_ENABLED=true
            - KAFKA_URL=${KAFKA_URL}
            - KAFKA_TOPIC_CASE_CREATE=${KAFKA_TOPIC_CASE_CREATE}
            - KAFKA_TOPIC_CASE_EMAIL_OUTBOUND=${KAFKA_TOPIC_CASE_EMAIL_OUTBOUND}
            - REACT_FRONTEND_URL=${REACT_FRONTEND_URL}
        depends_on:
            mongodb:
                condition: service_healthy
            camunda:
                condition: service_healthy

    c7-external-tasks:
        build:
            context: apps/java/services/c7-external-tasks
        links:
            - camunda
            - case-engine-rest-api
        environment:
            - CAMUNDA_BASE_URL=${CAMUNDA_BASE_URL}
            - CAMUNDA_USERNAME=${CAMUNDA_USERNAME}
            - CAMUNDA_PASSWORD=${CAMUNDA_PASSWORD}
            - KEYCLOAK_URL=${KEYCLOAK_TOKEN_URL}
            - WKS_CASE_API_URL=${WKS_CASE_API_URL}
            - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED}
            - DISABLE_BACKOFF_STRATEGY=${DISABLE_BACKOFF_STRATEGY}
        depends_on:
            camunda:
                condition: service_healthy
