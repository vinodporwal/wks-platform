version: '3.7'
name: wks-platform
services:
    minio:
        image: quay.io/minio/minio
        command: server /data --console-address ":9094"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        ports:
            - 9000:9000
            - 9094:9094
        environment:
            - H0neywe!!@54322
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        volumes:
            - minio:/data:rw

    mongodb:
        image: mongo:6.0.14
        ports:
            - 27017:27017
        healthcheck:
            test: mongosh --eval 'db.stats().ok' --quiet
            interval: 10s
            retries: 3
            start_period: 5s
            timeout: 10s
        volumes:
            - mongo:/data/db:rw

    opa:
        image: openpolicyagent/opa:0.70.0-static
        ports:
            - 8181:8181
        command:
            - run
            - --server
            - --log-level
            - debug
            - /etc/rules/wks_policy_rules.rego
        volumes:
            - ./opa:/etc/rules:ro
        environment:
            - OPA_LOG_LEVEL=debug
    keycloak:
        # image: quay.io/keycloak/keycloak:20.0.3
        build:
            context: .
            dockerfile: Dockerfile
        command: start-dev
        environment:
            KC_HEALTH_ENABLED: "true"
            KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
            KC_PROXY: "passthrough"
            KC_HTTP_RELATIVE_PATH: "/cm"
            # Public base URL Keycloak issues in its redirects. Env-driven so the
            # same image works locally (localhost) and in any deployment.
            KC_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-http://localhost:8082/cm}
        healthcheck:
            test: curl --fail http://localhost:8080/cm/health/ready || exit 1
            interval: 10s
            retries: 10
            start_period: 5s
            timeout: 20s
        ports:
            - 8082:8080
        volumes:
            - keycloak:/opt/keycloak/data/
            # Ensure krb5.conf and keytab files are passed into the container
            - ./krb5.conf:/etc/krb5.conf:ro
            - ./keycloak.keytab:/opt/keycloak/data/keycloak.keytab:ro
            - ./keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro

    storage-api:
        build:
            context: apps/java/services/storage-api
        ports:
            - 8085:8085
        links:
            - minio
        environment:
            - OPA_URL=${OPA_URL}
            - KEYCLOAK_URL=${KEYCLOAK_URL}
            - MINIO_HOST_INTERNAL=${MINIO_HOST_INTERNAL}
            - MINIO_HOST_EXTERNAL=${MINIO_HOST_EXTERNAL}
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        depends_on:
            minio:
                condition: service_healthy

volumes:
    mongo:
        driver: local
    minio:
        driver: local
    keycloak:
        driver: local

