<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Case Update Notification</title>
    <style>
        .header {
            background-color: #2F8B8B;
            color: white;
            padding: 10px;
        }
        .content {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        .case-details {
            margin: 15px 0;
        }
        .label {
            font-weight: bold;
            width: 120px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>A Case is updated with new Events</h2>
    </div>

    <div class="content">
        <div>
            <p th:text="'Case ' + ${caseTitle} + ' assigned to you is updated with new Events.'">Case Title placeholder</p>
        </div>

        <div class="case-details">
            <h3>Case Details:</h3>
            <p><span class="label">Number:</span> <span th:text="${caseNumber}">Case-001</span></p>
            <p><span class="label">Status:</span> <span th:text="${status}">Status</span></p>
            <p><span class="label">Title:</span> <span th:text="${caseName}">Case Name</span></p>
            <p><span class="label">Description:</span> <span th:text="${description}">Description</span></p>
            <p><span class="label">Category:</span> <span th:text="${caseCategory}">Category</span></p>
            <p><span class="label">URL:</span> <span th:text="${caseUrl}">URL</span></p>
        </div>

        <div>
            <h3>Next Steps:</h3>
            <p>See the updated case <a th:href="${caseUrl}" th:text="${caseUrl}">here</a></p>
        </div>

        <div>
            <p><span class="label">Environment:</span> <span th:text="${environment}">Environment</span></p>
        </div>
    </div>
</body>
</html>
