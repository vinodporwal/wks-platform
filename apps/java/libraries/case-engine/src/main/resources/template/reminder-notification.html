<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Overdue Notification</title>
    <style>
        .header {
            background-color: #f70213;
            color: white;
            padding: 10px;
        }
        .content {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        .case-details {
            margin: 15px 0;
        }
        .label {
            font-weight: bold;
            width: 120px;
            display: inline-block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
<div class="header">
    <h2> Reminder !! The case is Over due</h2>
</div>

<div class="content">
   

    <div class="case-details">
        <h3>Case Details:</h3>
        <p><span class="label">Number:</span> <span th:text="${caseNumber}">Case-001</span></p>
        <p><span class="label">Title:</span> <span th:text="${caseName}">2024-12-31</span></p>
        <p><span class="label">Status:</span> <span th:text="${status}">Status</span></p>
        <p><span class="label">Assigned To:</span> <span th:text="${assignedTo}">Case Name</span></p>
        <p><span class="label">Assigned By:</span> <span th:text="${assignedBy}">Case Owner</span></p>
    </div>


</div>
</body>
</html>
