    # password: your-bind-password
    url: ldap://my-openldap-container:389
    base-dn: dc=example,dc=com
    username: cn=admin,dc=example,dc=com
    password: admin
    
ldap:
  search:
    base: ou=users,dc=example,dc=com
    filter: "(objectClass=user)"


management.endpoints.web.exposure.include: health,info, metrics,db
management.endpoint.health.show-details: never

case.engine.case-creation-process: case-instance-create
case.engine.email-to-case-process: email-to-case
case.engine.email-to-case-outbound-process: email-to-case-outbound

case.engine.actuator.enabled: true
case.engine.swagger.enabled: true

wks.kafka.enabled: ${KAFKA_ENABLED:false}
wks.kafka.topic.case-create: ${KAFKA_TOPIC_CASE_CREATE:case-create}
wks.kafka.topic.case-email-outbound: ${KAFKA_TOPIC_CASE_EMAIL_OUTBOUND:case-email-outbound}
spring.kafka.bootstrap-servers: ${KAFKA_URL:localhost:9092}

react.frontend.url: ${REACT_FRONTEND_URL:http://localhost:3001/cm}

# SSO iframe integration
sso.allowed-origin: ${APM_ORIGIN:http://localhost:3000}
