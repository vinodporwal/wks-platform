# NGINX configuration
#
# Files are at: /usr/share/nginx/html/build/main.js etc.
# Browser requests: /cm/build/main.js
# We need to strip /cm prefix when looking up files.

server {
    listen 80;
    server_name localhost;

    # Redirect bare /cm to /cm/
    location = /cm {
        return 301 /cm/;
    }

    # Redirect root to /cm/
    location = / {
        return 301 /cm/;
    }

    location /cm/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /cm/index.html;
        proxy_buffering off;
    }
}
